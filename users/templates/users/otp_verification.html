{% extends "exp/base.html" %}

{% block content %}
  <h2>Verify Your OTP</h2>
  <form method="POST">
    {% csrf_token %}
    <div>
      <label for="otp">Enter OTP:</label>
      <input type="text" name="otp" id="otp" required>
    </div>
    <button type="submit" class="btn btn-primary">Verify OTP</button>
  </form>
{% endblock %}
