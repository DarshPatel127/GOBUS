services:
  db:
    image: postgres:17
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=gobus_data
      - POSTGRES_USER=darsh
      - POSTGRES_PASSWORD=12345678
    ports:
      - "5432:5432"

  web:
    build: .
    env_file:
      - .env
    command: gunicorn P2.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
      - gobus_static_volume:/app/staticfiles
    expose:
      - "8000"    
    depends_on:
      - db
    environment:
      - POSTGRES_DB=gobus_data
      - POSTGRES_USER=darsh
      - POSTGRES_PASSWORD=12345678
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432

  nginx:
    image: nginx:latest
    container_name: nginx_server
    ports:
      - "8000:80"
    volumes:
      - gobus_static_volume:/app/staticfiles
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
volumes:
  postgres_data:
  gobus_static_volume:
