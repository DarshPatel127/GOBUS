version: '3.8'

services:
  db:
    image: postgres:17
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=gobus_data
      - POSTGRES_USER=darsh
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    restart: always

  web:
    build: .
    dockerfile: Dockerfile.prod
    env_file:
      - .env.prod
    volumes:
      - gobus_static_volume:/app/staticfiles
    expose:
      - "8000"
    depends_on:
      - db
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - POSTGRES_DB=gobus_data
      - POSTGRES_USER=darsh
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - ALLOWED_HOSTS=${EC2_PUBLIC_DNS},${EC2_PUBLIC_IP}
    restart: always

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - gobus_static_volume:/app/staticfiles
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    restart: always

volumes:
  postgres_data:
  gobus_static_volume: